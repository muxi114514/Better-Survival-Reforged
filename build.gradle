plugins {
    id 'net.minecraftforge.gradle' version '6.+'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'java'
    id 'idea'
}

version = "${minecraft_version}-${mod_version}"
group = 'com.mx.bettersurvival'

base.archivesName.set("${mod_name}")

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Dev-only GameTests (src/gametest), run with ./gradlew runGameTestServer. They're never in the built jar.
sourceSets {
    gametest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            workingDirectory project.file('run')
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            workingDirectory project.file('run')
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }

        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

// Include generated resources in main source set
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // dev-only: other mods' jars for the GameTests (e.g. Ice and Fire + Citadel for its integration). Put them in
    // devmods/ (gitignored) named <name>-dev.jar; nothing here goes into the built jar.
    flatDir { dir 'devmods' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Original IaF and its dependency Citadel (optional at runtime, needed at compile time)
    compileOnly files(
        'libs/iceandfire-2.1.13-1.20.1-beta-5.jar',
        'libs/citadel-2.6.3-1.20.1.jar'
    )
    // JMixin (for chain lightning — BS calls JMixin's API directly)
    compileOnly files('libs/JMixin.jar')
    // dev-only GameTest runtime mods from devmods/, deobfuscated by ForgeGradle so they run in the dev environment
    fileTree(dir: 'devmods', include: '*-dev.jar').each { f ->
        runtimeOnly fg.deobf("devmods:${f.name - '-dev.jar'}:dev")
    }
}

// Workaround for SpongePowered/MixinGradle#38
afterEvaluate {
    tasks.configureReobfTaskForReobfJar.mustRunAfter(tasks.compileJava)
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_name,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : mod_version,
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
            'Build-On-Minecraft'      : minecraft_version
        ])
    }
}

jar.finalizedBy('reobfJar')

// Merge the resources and classes into the same directory
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release.set(17)
}

processResources {
    var expandProps = [
        minecraft_version          : minecraft_version,
        forge_version              : forge_version,
        forge_version_range        : forge_version_range,
        forge_loader_version_range : forge_loader_version_range,
        mod_id                     : mod_id,
        mod_name                   : mod_name,
        mod_version                : mod_version,
        mod_authors                : mod_authors,
        mod_description            : mod_description,
        mod_license                : mod_license
    ]
    filesMatching(['pack.mcmeta', 'META-INF/mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

// Disables Gradle's custom module metadata from being published to maven
tasks.withType(GenerateModuleMetadata) {
    enabled = false
}
